name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # each Python version reports its own result; one failure does not cancel the other
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,experiments,app]"
      - run: ruff check .
      - run: mypy
      - run: pytest -q

  # the versions of constraints.txt: the combination known to give the committed results
  pinned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev,experiments,app]" -c constraints.txt
      - run: pytest -q
