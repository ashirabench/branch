[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "branch-lca"
version = "0.2.2"
description = "BRANCH: a non-LLM BDI agent that completes an openLCA Life Cycle Assessment from a bill of materials and a location, asking the human only the questions that can flip the verdict."
readme = "README.md"
license = { text = "MPL-2.0" }
authors = [{ name = "Ashira Benchimol" }]
requires-python = ">=3.12"
keywords = ["life cycle assessment", "openLCA", "BDI agent", "active learning", "human-in-the-loop", "human-centered AI"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
olca = ["olca-ipc>=2.6", "olca-schema>=2.6"]
experiments = ["pandas", "matplotlib"]
report = ["reportlab", "matplotlib"]
app = ["gradio>=5", "reportlab", "matplotlib"]
gpu = ["cupy-cuda12x"]
database = ["JPype1", "jdk4py"]    # experiments/openlca/read_database.py
dev = ["pytest", "ruff", "mypy", "vulture", "olca-ipc>=2.6", "olca-schema>=2.6", "reportlab", "matplotlib"]
all = ["branch-lca[olca,experiments,app,dev]"]

[project.urls]
Repository = "https://github.com/ashirabench/branch"

# The data BRANCH reads at run time travels inside the installed package, as branch/data/.
# The folders are the list RUNTIME_DATA of branch/paths.py; a test keeps the two equal.
[tool.setuptools]
packages = ["branch", "branch.data"]

[tool.setuptools.package-dir]
"branch.data" = "data"

[tool.setuptools.package-data]
"branch.data" = ["regions/*.json", "materials/*.json", "benchmark/*.json", "cff/*.json", "cff/*.csv", "databases/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Style and common errors, checked on every push (.github/workflows/tests.yml).
[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["paper"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C90", "PLR0915"]
ignore = ["E731",     # a short lambda assigned to a name, used for the formulas of the terms
          "E741",     # l, I as names: indices in formulas follow the paper
          "B905"]     # zip without strict=: the lists zipped here are built together, a few lines above

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-statements = 40

[tool.ruff.lint.per-file-ignores]
"branch/__init__.py" = ["F401"]     # the public names of the package
"tests/*" = ["B", "C90", "PLR0915"]

# Types are checked where an error costs most: the core of the agent and the small modules everything
# else builds on. The other modules are read by the checker only as far as these use them.
[tool.mypy]
files = ["branch/beliefs.py", "branch/lca_model.py", "branch/montecarlo.py", "branch/query.py", "branch/agent.py",
         "branch/backend.py", "branch/quantities.py", "branch/factors.py", "branch/paths.py"]
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = true
