[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "branch-lca"
version = "0.2.1"
description = "BRANCH: a non-LLM BDI agent that completes an openLCA Life Cycle Assessment from a bill of materials and a location, asking the human only the questions that can flip the verdict."
readme = "README.md"
license = { text = "MPL-2.0" }
authors = [{ name = "Ashira Benchimol" }]
requires-python = ">=3.10"
keywords = ["life cycle assessment", "openLCA", "BDI agent", "active learning", "human-in-the-loop", "human-centered AI"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
olca = ["olca-ipc>=2.0", "olca-schema>=2.0"]
experiments = ["pandas", "matplotlib"]
report = ["reportlab", "matplotlib"]
app = ["gradio>=5", "reportlab", "matplotlib"]
gpu = ["cupy-cuda12x"]
notebook = ["jupyter", "nbformat", "nbconvert", "ipykernel"]
database = ["JPype1", "jdk4py"]    # experiments/openlca/read_database.py
dev = ["pytest", "olca-schema>=2.0", "reportlab", "matplotlib"]
all = ["branch-lca[olca,experiments,app,dev]"]

[project.urls]
Repository = "https://github.com/ashirabench/branch"

# The data BRANCH reads at run time travels inside the installed package, as branch/data/.
# The folders are the list RUNTIME_DATA of branch/paths.py; a test keeps the two equal.
[tool.setuptools]
packages = ["branch", "branch.data"]

[tool.setuptools.package-dir]
"branch.data" = "data"

[tool.setuptools.package-data]
"branch.data" = ["regions/*.json", "materials/*.json", "benchmark/*.json", "cff/*.json", "cff/*.csv", "databases/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
